apiVersion: v1
kind: Namespace
metadata:
  name: dbops-lab
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: dbops-lab
type: Opaque
stringData:
  POSTGRES_USER: dbops_app
  POSTGRES_PASSWORD: replace-before-apply
  POSTGRES_DB: dbops
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: dbops-lab
data:
  POSTGRES_INITDB_ARGS: "--data-checksums"
  PGDATA: /var/lib/postgresql/data/pgdata
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: dbops-lab
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: dbops-lab
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-client
  namespace: dbops-lab
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: dbops-lab
spec:
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: dbops-lab
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: dbops-lab
spec:
  serviceName: postgres
  replicas: 1
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: dbops-lab
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: postgres
          image: postgres:16.4
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-credentials
            - configMapRef:
                name: postgres-config
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          startupProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      securityContext:
        fsGroup: 999
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-backups
  namespace: dbops-lab
  labels:
    app.kubernetes.io/name: postgres-backups
    app.kubernetes.io/part-of: dbops-lab
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-logical-backup
  namespace: dbops-lab
  labels:
    app.kubernetes.io/name: postgres-logical-backup
    app.kubernetes.io/part-of: dbops-lab
spec:
  schedule: "0 */6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: postgres-logical-backup
        spec:
          restartPolicy: OnFailure
          containers:
            - name: pg-dump
              image: postgres:16.4
              envFrom:
                - secretRef:
                    name: postgres-credentials
              env:
                - name: PGHOST
                  value: postgres-client
                - name: PGPORT
                  value: "5432"
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgres-credentials
                      key: POSTGRES_PASSWORD
              command: ["/bin/sh", "-c"]
              args:
                - >-
                  set -eu;
                  mkdir -p /backups;
                  pg_dump --format=custom --file="/backups/dbops-$(date -u +%Y%m%dT%H%M%SZ).dump"
                  --username="$POSTGRES_USER" "$POSTGRES_DB"
              volumeMounts:
                - name: backup-storage
                  mountPath: /backups
          volumes:
            - name: backup-storage
              persistentVolumeClaim:
                claimName: postgres-backups
