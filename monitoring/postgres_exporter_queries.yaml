dbops_activity:
  query: |
    SELECT
      COALESCE(datname, '') AS datname,
      COUNT(*) FILTER (WHERE state = 'active') AS active_queries,
      COALESCE(
        MAX(EXTRACT(EPOCH FROM (clock_timestamp() - query_start))) FILTER (WHERE state = 'active'),
        0
      ) AS max_query_age_seconds
    FROM pg_stat_activity
    WHERE datname IS NOT NULL
    GROUP BY datname
  metrics:
    - datname:
        usage: "LABEL"
        description: "Nome do banco observado"
    - active_queries:
        usage: "GAUGE"
        description: "Quantidade de queries ativas"
    - max_query_age_seconds:
        usage: "GAUGE"
        description: "Idade em segundos da query ativa mais antiga"

dbops_lock_waits:
  query: |
    SELECT current_database() AS datname,
           COUNT(*) FILTER (WHERE wait_event_type = 'Lock') AS blocked_queries
    FROM pg_stat_activity
    WHERE datname = current_database()
  metrics:
    - datname:
        usage: "LABEL"
        description: "Nome do banco observado"
    - blocked_queries:
        usage: "GAUGE"
        description: "Sessões aguardando lock"

dbops_backup_status:
  query: |
    SELECT backup_type,
           COALESCE(EXTRACT(EPOCH FROM (clock_timestamp() - last_success_at)), -1) AS age_seconds,
           CASE
             WHEN last_success_at IS NULL OR (last_failure_at IS NOT NULL AND last_failure_at > last_success_at)
             THEN 1 ELSE 0
           END AS failed,
           COALESCE(last_duration_seconds, 0) AS duration_seconds,
           COALESCE(last_size_bytes, 0) AS size_bytes
    FROM public.dbops_backup_status
  metrics:
    - backup_type:
        usage: "LABEL"
        description: "Tipo de backup"
    - age_seconds:
        usage: "GAUGE"
        description: "Idade em segundos do último backup bem-sucedido"
    - failed:
        usage: "GAUGE"
        description: "Indica falha ou ausência de backup válido"
    - duration_seconds:
        usage: "GAUGE"
        description: "Duração do último backup"
    - size_bytes:
        usage: "GAUGE"
        description: "Tamanho do último backup"
