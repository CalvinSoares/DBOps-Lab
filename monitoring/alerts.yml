groups:
  - name: dbops-postgresql
    rules:
      - alert: PostgreSQLExporterDown
        expr: pg_up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL não está disponível para o exporter"
          description: "A coleta pg_up está em zero por pelo menos dois minutos. Ação: verificar o container PostgreSQL, conectividade e credenciais do exporter."

      - alert: PostgreSQLConnectionsHigh
        expr: pg_stat_database_numbackends{datname="dbops"} > 50
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Muitas conexões no banco dbops"
          description: "O banco ultrapassou 50 sessões. Ação: verificar pool, sessões ociosas, consultas longas e max_connections antes de aumentar o limite."

      - alert: PostgreSQLDeadlocksDetected
        expr: increase(pg_stat_database_deadlocks{datname="dbops"}[5m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Deadlock detectado no PostgreSQL"
          description: "Houve aumento de deadlocks nos últimos cinco minutos. Ação: correlacionar logs, pg_stat_activity e a transação bloqueadora."

      - alert: PostgreSQLLongRunningQuery
        expr: dbops_activity_max_query_age_seconds{datname="dbops"} > 30
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Query ativa há mais de 30 segundos"
          description: "Ação: consultar pg_stat_activity, plano de execução e bloqueadores antes de cancelar ou otimizar a sessão."

      - alert: PostgreSQLBackupFailed
        expr: dbops_backup_status_failed{backup_type=~"logical|physical"} > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Último backup PostgreSQL falhou ou não existe"
          description: "Ação: consultar o status do backup, o manifesto, o espaço disponível e executar um backup validado."

      - alert: PostgreSQLBackupStale
        expr: dbops_backup_status_age_seconds{backup_type=~"logical|physical"} > 86400
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Backup PostgreSQL está atrasado"
          description: "O último backup bem-sucedido tem mais de 24 horas. Ação: verificar agendamento, WAL, armazenamento e falhas recentes."

      - alert: NodeFilesystemLow
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) < 0.15
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Pouco espaço disponível no filesystem monitorado"
          description: "Menos de 15% está disponível. Ação: conter crescimento, validar WAL/backups e liberar espaço conforme runbook."
